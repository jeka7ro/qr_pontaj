<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="160" height="160" fill="url(#bgGrad)"/>
  
  <!-- Subtle border inner stroke -->
  <rect x="0.5" y="0.5" width="159" height="159" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Head -->
  <circle cx="80" cy="58" r="28" fill="url(#avatarGrad)" filter="url(#subtleShadow)"/>

  <!-- Body / Shoulders -->
  <path d="M26 142 C26 108, 50 98, 80 98 C110 98, 134 108, 134 142 Z" fill="url(#avatarGrad)" filter="url(#subtleShadow)"/>
</svg>
